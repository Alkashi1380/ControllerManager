name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilation
        run: dotnet build ControllerManager.csproj -c Release

      - name: Tests unitaires
        run: dotnet test ControllerManager.Tests -c Release --logger "console;verbosity=normal"
